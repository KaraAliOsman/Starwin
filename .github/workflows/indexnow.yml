name: Notify search engines
on:
  workflow_run:
    workflows: ['Verify Starwin']
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: starwin-indexnow-production
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/indexnow-production.json
          key: indexnow-production-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-production-v1-
      - name: Wait for publication and notify changed public pages
        env:
          INDEXNOW_EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: node scripts/indexnow.mjs --submit
      - uses: actions/cache/save@v4
        with:
          path: .cache/indexnow-production.json
          key: indexnow-production-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt
          path: verificacion/indexnow/ultimo-envio.json
          retention-days: 30
